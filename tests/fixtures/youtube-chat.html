<!doctype html>
<html lang="zh-TW">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'; trusted-types 'none'">
<title>YouTube 聊天室篩選驗證</title>
<style>
  :root { --yt-live-chat-primary-text-color: #fff; --yt-live-chat-background-color: #0f0f0f; --yt-live-chat-secondary-text-color: #aaa; --yt-live-chat-button-default-text-color: #fff; --yt-live-chat-link-text-color: #3ea6ff; --yt-live-chat-button-default-background-color: #ffffff33; }
  body { margin: 32px; color: #efeff1; background: #0f0f0f; font: 14px Arial, sans-serif; }
  yt-live-chat-renderer { display: block; width: 340px; border: 1px solid #45454a; }
  yt-live-chat-header-renderer { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 10px; border-bottom: 1px solid #45454a; }
  #primary-content { flex: 1; }
  #viewer-leaderboard-entry-point { margin-left: auto; font-size: 12px; color: #bf94ff; }
  #close-button button { color: #efeff1; border: 0; background: transparent; font-size: 20px; }
  #live-chat-header-context-menu { color: #efeff1; border: 0; background: transparent; font-size: 20px; }
  #chat-contents, #item-scroller { height: 430px; }
  yt-live-chat-renderer.summary-open #chat-contents, yt-live-chat-renderer.summary-open #item-scroller { height: 210px; }
  #fixture-summary { box-sizing: border-box; height: 220px; padding: 20px; background: #282828; border-radius: 20px; }
  #item-scroller { overflow: auto; }
  yt-live-chat-text-message-renderer { display: flex; position: relative; padding: 8px 12px; }
  yt-live-chat-text-message-renderer > #content { flex: 1; min-width: 0; }
  yt-live-chat-text-message-renderer > #author-photo { display: block; flex: none; width: 24px; height: 24px; overflow: hidden; border-radius: 50%; }
  #author-photo img { display: block; border-radius: 50%; }
  yt-live-chat-text-message-renderer > #menu { position: absolute; right: 12px; top: 4px; }
  #menu button { width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; color: inherit; background: transparent; }
  #menu button:hover { background: #ffffff33; }
  .fixture-dialog { position: fixed; top: 140px; left: 40px; z-index: 3000; max-width: 280px; padding: 20px; color: #fff; background: #282828; border: 1px solid #555; border-radius: 12px; }
  .fixture-dialog button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 18px; color: inherit; background: #555; }
  #fixture-requests { margin-top: 14px; color: #aaa; font-size: 12px; }
  .fixture-overlay { position: fixed; z-index: 2147483647; left: 32px; top: 170px; box-sizing: border-box; width: 320px; height: 220px; padding: 20px; background: #71412d; }
  body:has(.fixture-overlay:not([hidden])) #item-scroller { isolation: isolate; }
  #message-action-menu { position: fixed; top: 160px; right: 8px; z-index: 20; padding: 8px; border-radius: 12px; background: #282828; }
  #message-action-menu button { display: block; padding: 10px 20px; color: inherit; background: none; border: 0; }
  #timestamp { color: #adadb8; font-size: 10px; margin-right: 5px; }
  #message img { width: 24px; vertical-align: middle; }
  [author-type="owner"] #author-name { color: #ffd600; }
  [author-type="moderator"] #author-name { color: #5e84f1; }
  [author-type="member"] #author-name { color: #2ba640; }
  [type="moderator"] { color: #5e84f1; }
  [type="owner"] { color: #ffd600; }
  [type="member"] { color: #2ba640; }
  yt-live-chat-author-badge-renderer svg { width: 16px; height: 16px; fill: currentColor; vertical-align: middle; }
  yt-live-chat-author-chip[is-highlighted] #author-name { color: #0f0f0f; background: #e6e6e6; border-radius: 10px; padding: 2px 4px; }
  yt-live-chat-author-chip[is-highlighted] yt-live-chat-author-badge-renderer { color: #0f0f0f; }
  .input-area { padding: 14px; border-top: 1px solid #45454a; }
  .input-area input { box-sizing: border-box; width: 100%; padding: 8px; color: inherit; background: #303034; border: 0; }
  .fixture-tools { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  yt-live-chat-app { display: block; }
  tp-yt-iron-dropdown { position: fixed; z-index: 10; }
  ytd-menu-popup-renderer { display: block; background: #282828; border-radius: 12px; overflow: auto; }
  tp-yt-paper-item { display: flex; align-items: center; gap: 16px; padding: 10px 16px; white-space: nowrap; font-size: 16px; }
  tp-yt-paper-item span { min-width: 0; overflow-wrap: anywhere; }
  yt-live-chat-toggle-renderer { display: block; }
  body.embedded { margin: 0; }
  body.embedded h2, body.embedded .fixture-tools { display: none; }
  body.embedded yt-live-chat-renderer { width: 100%; box-sizing: border-box; }
  body.embedded #chat-contents, body.embedded #item-scroller { height: calc(100vh - 126px); }
</style>
<h2>YouTube 聊天室測試頁</h2>
<div id="owner" hidden><a href="/@fixture_channel">測試頻道</a></div>
<yt-live-chat-app>
<yt-live-chat-renderer>
  <yt-live-chat-header-renderer>
    <div id="primary-content"><span id="view-selector"><button>トップチャット ▾</button></span></div>
    <div id="viewer-leaderboard-entry-point">♛ 0 XP</div>
    <button id="live-chat-header-context-menu" aria-label="聊天室選項">⋮</button>
    <div id="close-button"><button aria-label="關閉聊天室">×</button></div>
  </yt-live-chat-header-renderer>
  <div id="chat-contents"><div id="item-scroller"><div id="item-offset"><div id="items"></div></div></div><button id="show-more" disabled hidden>顯示更多</button></div>
  <div id="fixture-summary" hidden>✦ チャットの要約<br>摘要測試：這個原生區塊會占用 220px，縮小訊息區；篩選模式應繼續填滿原有範圍。</div>
  <div class="input-area" id="input-panel"><input aria-label="傳送訊息" placeholder="傳送訊息（測試頁不傳送）"></div>
</yt-live-chat-renderer>
<tp-yt-iron-dropdown style="left: 24px; top: 52px; max-width: 400px;" hidden>
  <ytd-menu-popup-renderer role="menu" style="max-width: 215px; max-height: 160px; box-sizing: border-box;">
    <tp-yt-paper-item role="menuitem">♙ <span>参加者</span></tp-yt-paper-item>
    <yt-live-chat-toggle-renderer><tp-yt-paper-item role="menuitem">♡ <span>リアクション</span><input type="checkbox" checked aria-label="リアクション"></tp-yt-paper-item></yt-live-chat-toggle-renderer>
    <tp-yt-paper-item role="menuitem">↗ <span>チャットをポップアウト</span></tp-yt-paper-item>
    <tp-yt-paper-item role="menuitem">▣ <span>フィードバックを送信</span></tp-yt-paper-item>
  </ytd-menu-popup-renderer>
</tp-yt-iron-dropdown>
<tp-yt-iron-dropdown hidden><div id="message-action-menu" role="menu"><button role="menuitem">報告</button><button role="menuitem">ブロック</button></div></tp-yt-iron-dropdown>
</yt-live-chat-app>
<div class="fixture-tools">
  <button id="add-mod">新增 Moderator 訊息</button>
  <button id="add-user">新增 @alice 訊息</button>
  <button id="burst">批次新增 100 則管理員訊息</button>
  <button id="edit-last">修改最後一則訊息</button>
  <button id="prune">清空原聊天室 DOM</button>
  <button id="remount">重建聊天室</button>
  <button id="overlay-toggle">顯示遮擋測試物件</button>
  <button id="summary-toggle">切換聊天摘要</button>
  <button id="width-toggle">切換聊天室寬度</button>
</div>
<div class="fixture-overlay" id="fixture-overlay" hidden>原生浮動物件遮擋測試</div>
<p id="fixture-requests" data-profiles="0" data-menus="0">名稱查詢 0 次 · 操作選單 0 次</p>
<p id="fixture-native-result" role="status"></p>
<script>
  const fixtureParams = new URL(location.href).searchParams
  const fixtureChannel = fixtureParams.get('channel')
  if (/^[a-z0-9_]+$/i.test(fixtureChannel || '')) document.querySelector('#owner a').href = `/@${fixtureChannel}`
  if (fixtureParams.has('light')) {
    for (const [key, value] of Object.entries({
      '--yt-live-chat-primary-text-color': '#0f0f0f', '--yt-live-chat-background-color': '#fff',
      '--yt-live-chat-secondary-text-color': '#606060', '--yt-live-chat-button-default-text-color': '#065fd4',
    })) document.documentElement.style.setProperty(key, value)
  }
  document.getElementById('width-toggle').onclick = () => {
    const renderer = document.querySelector('yt-live-chat-renderer')
    renderer.style.width = renderer.style.width === '500px' ? '340px' : '500px'
  }
  document.getElementById('summary-toggle').onclick = () => {
    const summary = document.getElementById('fixture-summary')
    summary.hidden = !summary.hidden
    document.querySelector('yt-live-chat-renderer').classList.toggle('summary-open', !summary.hidden)
  }
  document.getElementById('overlay-toggle').onclick = () => {
    const overlay = document.getElementById('fixture-overlay')
    overlay.hidden = !overlay.hidden
  }
  if (fixtureParams.has('overlay')) document.getElementById('fixture-overlay').hidden = false
  if (fixtureParams.has('embedded')) document.body.classList.add('embedded')
  const fixtureRequests = document.getElementById('fixture-requests')
  const countRequest = type => {
    fixtureRequests.dataset[type] = String(+fixtureRequests.dataset[type] + 1)
    fixtureRequests.textContent = `名稱查詢 ${fixtureRequests.dataset.profiles} 次 · 操作選單 ${fixtureRequests.dataset.menus} 次`
  }
  window.ytcfg = { get(key) {
    if (key === 'LOGGED_IN') return !fixtureParams.has('signedOut')
    if (key === 'INNERTUBE_CONTEXT') return { client: { clientVersion: 'fixture', hl: 'zh-TW', gl: 'TW' } }
  } }
  const originalFetch = window.fetch
  window.fetch = (url, options) => {
    if (!String(url).startsWith('/youtubei/v1/browse')) return originalFetch(url, options)
    countRequest('profiles')
    const id = JSON.parse(options.body).browseId
    let profile = id === 'UCAbCdEfGhIjKlMnOpQrStUv' ? ['Alice 的頻道', '@alice']
      : id === 'UCZYXWVUTSRQPONMLKJIHGFE' ? ['聊天室管理員', '@mod_account'] : ['測試實況主', '@fixture_channel']
    if (fixtureParams.has('longName')) profile = ['這是一個非常長的頻道名稱 Long Channel Name With Many Characters', '@VeryLongAccountHandleForSingleLineLayout']
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => fixtureParams.has('failProfile') ? reject(new Error('fixture offline'))
        : resolve(new Response(JSON.stringify({ metadata: { channelMetadataRenderer: {
          externalId: id, title: profile[0], vanityChannelUrl: `https://www.youtube.com/${profile[1]}`,
        } } }), { headers: { 'Content-Type': 'application/json' } })), +fixtureParams.get('profileDelay') || 200)
      options.signal.addEventListener('abort', () => { clearTimeout(timer); reject(new Error('fixture aborted')) }, { once: true })
    })
  }
  // Simulate YouTube's event bridge and native menu models; no account actions
  // or chat messages are sent from this fixture.
  document.querySelector('yt-live-chat-app').addEventListener('yt-action', event => {
    if (event.detail?.actionName !== 'yt-service-request') return
    countRequest('menus')
    const params = event.detail.args[1].liveChatItemContextMenuEndpoint.params
    event.detail.returnValue.push({ ajaxPromise: new Promise((resolve, reject) => setTimeout(() => {
      if (fixtureParams.has('failMenu')) { reject(new Error('fixture menu failed')); return }
      resolve({ data: { liveChatItemContextMenuSupportedRenderers: { menuRenderer: {
        items: fixtureParams.has('signedOut') ? [] : ['報告', 'ブロック'].map((text, index) => index
          ? { menuNavigationItemRenderer: { text: { simpleText: text }, navigationEndpoint: { fixtureAction: { params, action: 'block' } } } }
          : { menuServiceItemRenderer: { text: { simpleText: text }, serviceEndpoint: { fixtureAction: { params, action: 'report' } } } }),
      } } } })
    }, +fixtureParams.get('menuDelay') || 350)) })
  })
  customElements.define('ytd-menu-popup-renderer', class extends HTMLElement {
    set data(value) {
      this.replaceChildren()
      const list = this.appendChild(document.createElement('tp-yt-paper-listbox'))
      list.id = 'items'
      for (const item of value.items || []) {
        const navigation = !!item.menuNavigationItemRenderer
        const model = item.menuNavigationItemRenderer || item.menuServiceItemRenderer
        const endpoint = model.navigationEndpoint || model.serviceEndpoint
        const renderer = list.appendChild(document.createElement(navigation ? 'ytd-menu-navigation-item-renderer' : 'ytd-menu-service-item-renderer'))
        renderer.className = 'item'
        const host = navigation ? renderer.appendChild(document.createElement('a')) : renderer
        const button = host.appendChild(document.createElement('tp-yt-paper-item'))
        button.setAttribute('role', 'menuitem')
        button.tabIndex = 0
        const icon = button.appendChild(document.createElement('yt-icon'))
        icon.textContent = endpoint.fixtureAction.action === 'block' ? '⊘' : '⚑'
        const wrapper = navigation ? button : button.appendChild(document.createElement('div'))
        if (!navigation) wrapper.className = 'text-wrapper'
        const title = wrapper.appendChild(document.createElement('yt-formatted-string'))
        if (!navigation) title.className = 'title'
        // Native variants reserve space at both the renderer and title levels.
        title.style.marginRight = '24px'
        title.textContent = model.text.simpleText
        renderer.style.minWidth = '160px'
        const activate = () => {
          const { params, action } = endpoint.fixtureAction
          this.dispatchEvent(new CustomEvent('yt-action', { bubbles: true, composed: true,
            detail: { actionName: 'yt-close-popup-action', args: ['ytd-menu-popup-renderer'] } }))
          const dialog = document.createElement('div')
          dialog.className = 'fixture-dialog'
          dialog.setAttribute('role', 'dialog')
          dialog.setAttribute('aria-label', `${model.text.simpleText}確認`)
          dialog.appendChild(document.createTextNode(`${model.text.simpleText}：${params}（測試確認視窗，不會執行實際操作）`))
          const close = dialog.appendChild(document.createElement('button'))
          close.textContent = '關閉確認視窗'
          close.onclick = () => dialog.remove()
          document.querySelector('yt-live-chat-app').appendChild(dialog)
          document.getElementById('fixture-native-result').textContent = `${action}: ${params}`
          close.focus()
        }
        button.onclick = activate
        button.onkeydown = event => { if (event.key === 'Enter') activate() }
      }
    }
  })
  for (const popup of document.querySelectorAll('tp-yt-iron-dropdown')) popup.close = () => { popup.hidden = true }
  document.getElementById('live-chat-header-context-menu').onclick = () => {
    const popup = document.querySelector('tp-yt-iron-dropdown')
    popup.hidden = !popup.hidden
  }
  let serial = 0
  const items = () => document.querySelector('#item-scroller #items')
  function addMessage(user, role = '') {
    const line = document.createElement('yt-live-chat-text-message-renderer')
    line.id = `message-${++serial}`
    line.setAttribute('author-type', role)
    line.setAttribute('whole-message-clickable', 'fixture')
    line.addEventListener('click', () => { document.getElementById('message-action-menu').parentElement.hidden = false })
    line.data = { authorExternalChannelId: user === '@alice'
      ? 'UCAbCdEfGhIjKlMnOpQrStUv' : user === '@mod_account'
      ? 'UCZYXWVUTSRQPONMLKJIHGFE' : 'UC1234567890123456789012',
      authorName: { simpleText: user }, contextMenuEndpoint: { liveChatItemContextMenuEndpoint: { params: line.id } } }
    const photo = line.appendChild(document.createElement('yt-img-shadow'))
    photo.id = 'author-photo'
    const avatar = photo.appendChild(document.createElement('img'))
    avatar.alt = ''
    // YouTube keeps these fixed pixel attributes even when the host is resized.
    avatar.width = 24
    avatar.height = 24
    avatar.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><rect width="24" height="24" fill="#5e84f1"/><circle cx="12" cy="9" r="4" fill="white"/><path d="M4 24a8 8 0 0116 0" fill="white"/></svg>')
    line.data.authorPhoto = { thumbnails: [{ url: avatar.src }] }
    const content = line.appendChild(document.createElement('div'))
    content.id = 'content'
    const time = content.appendChild(document.createElement('span'))
    time.id = 'timestamp'
    time.textContent = `14:${String(serial).padStart(2, '0')}`
    const chip = content.appendChild(document.createElement('yt-live-chat-author-chip'))
    const author = chip.appendChild(document.createElement('span'))
    author.id = 'author-name'
    author.textContent = user
    const highlighted = role === 'owner' && fixtureParams.has('highlightedOwner')
    if (highlighted) chip.setAttribute('is-highlighted', '')
    if (role) {
      const badge = (highlighted ? author : chip).appendChild(document.createElement('yt-live-chat-author-badge-renderer'))
      badge.setAttribute('type', highlighted ? 'verified' : role)
      badge.setAttribute('aria-label', highlighted ? '確認済み' : role === 'member' ? '會員' : role === 'owner' ? 'Broadcaster' : 'Moderator')
      const svg = badge.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'svg'))
      svg.setAttribute('viewBox', '0 0 24 24')
      const path = svg.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'path'))
      path.setAttribute('fill', 'currentColor')
      path.setAttribute('d', highlighted
        ? 'M12 1C5.925 1 1 5.925 1 12s4.925 11 11 11 11-4.925 11-11S18.075 1 12 1Zm5.707 7.293a1 1 0 010 1.414L10 17.414l-3.707-3.707a1 1 0 111.414-1.414L10 14.586l6.293-6.293a1 1 0 011.414 0Z'
        : 'M4 3h6v7H4zm10 0h6v7h-6zM4 14h6v7H4zm10 0h6v7h-6z')
    }
    content.appendChild(document.createTextNode(': '))
    const message = content.appendChild(document.createElement('span'))
    message.id = 'message'
    message.textContent = user === '@ordinary'
      ? '這是一則用來驗證換行的長訊息，文字應該避開右側選單按鈕。 LongMessageWithoutSpacesForChatLayoutTest '.repeat(2)
      : `測試訊息 ${serial} `
    const emoji = message.appendChild(document.createElement('img'))
    emoji.className = 'emoji'
    emoji.alt = '😀'
    emoji.setAttribute('shared-tooltip-text', ':grinning:')
    emoji.src = 'https://fonts.gstatic.com/s/e/notoemoji/15.1/1f600/72.png'
    const link = message.appendChild(document.createElement('a'))
    link.href = '#fixture-link'
    link.textContent = '連結'
    const menu = line.appendChild(document.createElement('div'))
    menu.id = 'menu'
    const button = menu.appendChild(document.createElement('button'))
    button.setAttribute('aria-label', '訊息選項')
    button.textContent = '⋮'
    items().appendChild(line)
  }
  addMessage('@fixture_channel', 'owner')
  addMessage('@mod_account', 'moderator')
  addMessage('@ordinary')
  addMessage('@alice', 'member')
  document.getElementById('add-mod').onclick = () => addMessage('@mod_account', 'moderator')
  document.getElementById('add-user').onclick = () => addMessage('@alice')
  document.getElementById('burst').onclick = () => { for (let i = 0; i < 100; i++) addMessage('@mod_account', 'moderator') }
  document.getElementById('edit-last').onclick = () => {
    const message = items().lastElementChild?.querySelector('#message')
    if (message) message.textContent = '已更新的訊息'
  }
  document.getElementById('prune').onclick = () => items().replaceChildren()
  document.getElementById('remount').onclick = () => {
    const renderer = document.querySelector('yt-live-chat-renderer')
    const copy = renderer.cloneNode(true)
    copy.querySelectorAll('.ytcf-panel, #yt-chat-tweaks-filter-button, #yt-chat-tweaks-reload-button').forEach(node => node.remove())
    copy.querySelector('#chat-contents').className = ''
    const scroller = copy.querySelector('#item-scroller')
    scroller.className = ''
    scroller.inert = false
    scroller.removeAttribute('aria-hidden')
    copy.querySelector('#items').replaceChildren()
    renderer.replaceWith(copy)
  }
</script>
<script src="/YouTubeLiveChatTweaks.user.js"></script>
</html>
