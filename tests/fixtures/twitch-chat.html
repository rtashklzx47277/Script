<!doctype html>
<html lang="zh-TW">
<meta charset="utf-8">
<title>Twitch 聊天室篩選驗證</title>
<style>
  :root { --color-background-base: #18181b; --color-text-base: #efeff1; --color-text-alt-2: #adadb8; }
  body { margin: 32px; color: #efeff1; background: #0e0e10; font: 14px Arial, sans-serif; }
  .stream-chat { width: 340px; border: 1px solid #45454a; }
  .right-column { position: relative; width: 342px; }
  .right-column__toggle-visibility { position: absolute; left: 8px; top: 14px; z-index: 2; }
  .right-column__toggle-visibility button { color: inherit; background: none; border: 0; cursor: pointer; }
  .stream-chat-header { position: relative; display: flex; height: 60px; justify-content: center; align-items: center; }
  .actions { display: flex; position: absolute; right: 8px; align-items: center; }
  .actions button { color: inherit; background: none; border: 0; cursor: pointer; }
  .chat-room__content { display: flex; flex-direction: column; }
  .fixture-banner { padding: 10px 14px; border-bottom: 1px solid #45454a; background: #1f1f23; font-size: 12px; }
  .fixture-banner p { margin: 2px 0 0; color: #adadb8; }
  .chat-host, [data-a-target="chat-scroller"] { height: 430px; }
  [data-a-target="chat-scroller"] { overflow: auto; }
  .chat-line__message { padding: 8px 10px; }
  .fixture-reply { margin: 0 0 4px; color: #adadb8; font-size: 12px; }
  .chat-badge { width: 18px; vertical-align: middle; }
  .chat-image { width: 28px; vertical-align: middle; }
  .fixture-emote { padding: 0; border: 0; background: transparent; color: inherit; }
  .chat-input { padding: 10px 12px; border-top: 1px solid #45454a; }
  .chat-input__textarea input { box-sizing: border-box; width: 100%; padding: 8px; color: inherit; background: #303034; border: 0; }
  .chat-input__buttons-container { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: #adadb8; font-size: 12px; }
  .chat-input__buttons-container button { color: #fff; background: #9147ff; border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .fixture-tools { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .fixture-overlay { position: fixed; z-index: 2147483647; left: 32px; top: 170px; box-sizing: border-box; width: 320px; height: 220px; padding: 20px; background: #71412d; }
</style>
<h2>聊天室測試頁</h2>
<div class="right-column">
  <div class="right-column__toggle-visibility"><button type="button" aria-label="摺疊">↦</button></div>
  <div class="stream-chat">
    <div class="stream-chat-header">
      <h4 id="chat-room-header-label">實況聊天室</h4>
      <div class="actions"><div><button data-test-selector="chat-viewer-list" aria-label="社群">♙</button></div></div>
    </div>
    <section class="chat-room">
      <div class="chat-room__content">
        <div class="fixture-banner"><strong>成為英雄！</strong><p>送給 100 位實況追隨者！</p></div>
        <div class="chat-list--default">
          <div class="chat-host"><div data-a-target="chat-scroller"><div class="chat-scrollable-area__message-container" style="padding-top: 16px;"></div></div></div>
        </div>
        <div class="chat-room__notifications"></div>
        <div class="chat-input">
          <div class="chat-input__textarea"><input aria-label="傳送訊息" placeholder="傳送訊息（測試頁不傳送）"></div>
          <div class="chat-input__buttons-container" data-test-selector="chat-input-buttons-container">
            <span>◆ 0 ○ 43.4萬</span>
            <span><button type="button">聊天</button></span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
<div class="fixture-tools">
  <button id="add-mod">新增管理員訊息</button>
  <button id="add-vip">新增 VIP 訊息</button>
  <button id="add-user">新增指定帳號 alice 訊息</button>
  <button id="add-ordinary">新增一般用戶訊息</button>
  <button id="mod-reply-ordinary">管理員回覆一般用戶</button>
  <button id="mod-reply-excluded">管理員回覆排除用戶</button>
  <button id="ordinary-reply-mod">一般用戶回覆管理員</button>
  <button id="ordinary-reply-orphan">一般用戶回覆未載入的實況主留言</button>
  <button id="ordinary-reply-excluded">一般用戶回覆排除用戶</button>
  <button id="burst">批次新增 100 則管理員訊息</button>
  <button id="edit-last">修改最後一則訊息</button>
  <button id="prune">清空原聊天室 DOM</button>
  <button id="remount">重建聊天室</button>
  <button id="navigate">切換頻道</button>
  <button id="split-toggle">切換分割螢幕模式</button>
  <button id="overlay-toggle">顯示遮擋測試物件</button>
</div>
<div class="fixture-overlay" id="fixture-overlay" hidden>原生浮動物件遮擋測試</div>
<script>
  document.getElementById('overlay-toggle').onclick = () => {
    const overlay = document.getElementById('fixture-overlay')
    overlay.hidden = !overlay.hidden
  }
  if (new URL(location.href).searchParams.has('overlay')) document.getElementById('fixture-overlay').hidden = false
  const scroller = () => document.querySelector('.chat-scrollable-area__message-container') || document.querySelector('[data-a-target="chat-scroller"]')
  let serial = 0
  function addMessage(user, role = '', reply = null) {
    const line = document.createElement('div')
    line.className = 'chat-line__message'
    line.dataset.aTarget = 'chat-line-message'
    line.dataset.aUser = user
    const container = document.createElement('div')
    container.className = 'chat-line__message-container'
    if (reply) {
      if (reply.parentId) line.dataset.replyParentId = reply.parentId
      if (reply.parentUser) line.dataset.replyParentUser = reply.parentUser
      const quote = document.createElement('p')
      quote.className = 'fixture-reply'
      quote.title = reply.parentText || ''
      quote.append('回覆 ')
      const target = document.createElement('span')
      target.setAttribute('dir', 'auto')
      target.textContent = `@${reply.parentDisplay || reply.parentUser}`
      const text = document.createElement('span')
      text.setAttribute('dir', 'auto')
      text.textContent = reply.parentText || ''
      quote.append(target, '：', text)
      container.appendChild(quote)
    }
    const row = document.createElement('div')
    const badge = role === 'moderator'
      ? '<button data-a-target="chat-badge"><img class="chat-badge" alt="管理員" src="https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1"></button>'
      : role === 'vip'
        ? '<button data-a-target="chat-badge"><img class="chat-badge" alt="VIP" src="https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/1"></button>'
        : ''
    row.innerHTML = `<span class="chat-line__username-container">${badge}<span data-a-target="chat-message-username" data-a-user="${user}" style="color:#ffb86c">${user}</span></span>: <span data-a-target="chat-line-message-body">測試訊息 ${++serial} <button class="fixture-emote" aria-label="Kappa"><img class="chat-image" alt="Kappa" src="https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/1.0"></button></span>`
    container.appendChild(row)
    line.appendChild(container)
    line.dataset.id = serial <= 3 ? `fixture-${serial}` : `fixture-${Date.now()}-${serial}`
    scroller().appendChild(line)
  }
  addMessage('mod_account', 'moderator')
  addMessage('fixture_channel')
  addMessage('ordinary')
  document.getElementById('add-mod').onclick = () => addMessage('mod_account', 'moderator')
  document.getElementById('add-vip').onclick = () => addMessage('vip_account', 'vip')
  document.getElementById('add-user').onclick = () => addMessage('alice')
  document.getElementById('add-ordinary').onclick = () => addMessage('ordinary')
  document.getElementById('mod-reply-ordinary').onclick = () => addMessage('mod_account', 'moderator', {
    parentUser: 'ordinary', parentDisplay: '一般觀眾', parentText: '一般觀眾的提問', parentId: 'fixture-3',
  })
  document.getElementById('mod-reply-excluded').onclick = () => addMessage('mod_account', 'moderator', {
    parentUser: 'excluded_user', parentDisplay: '排除帳號', parentText: '排除用戶的原留言', parentId: 'fixture-excluded-1',
  })
  document.getElementById('ordinary-reply-mod').onclick = () => addMessage('ordinary', '', {
    parentUser: 'mod_account', parentDisplay: '管理員', parentText: '管理員的公告', parentId: 'fixture-1',
  })
  document.getElementById('ordinary-reply-orphan').onclick = () => addMessage('ordinary', '', {
    parentUser: 'fixture_channel', parentDisplay: '實況主', parentText: '未載入的原留言', parentId: 'fixture-unseen-1',
  })
  document.getElementById('ordinary-reply-excluded').onclick = () => addMessage('ordinary', '', {
    parentUser: 'excluded_user', parentDisplay: '排除帳號', parentText: '排除用戶的原留言', parentId: 'fixture-excluded-1',
  })
  document.getElementById('burst').onclick = () => { for (let i = 0; i < 100; i++) addMessage('mod_account', 'moderator') }
  document.getElementById('edit-last').onclick = () => {
    const message = scroller().lastElementChild?.querySelector('[data-a-target="chat-line-message-body"]')
    if (message) message.textContent = '已更新的訊息'
  }
  document.getElementById('prune').onclick = () => scroller().replaceChildren()
  document.getElementById('remount').onclick = () => {
    const chat = document.querySelector('.stream-chat')
    // The application does not reproduce the userscript's injected controls.
    const copy = chat.cloneNode(true)
    copy.querySelectorAll('.ttc-panel, .ttc-toggle').forEach(node => node.remove())
    copy.querySelector('.chat-host').className = 'chat-host'
    copy.querySelector('[data-a-target="chat-scroller"]').className = ''
    ;(copy.querySelector('.chat-scrollable-area__message-container') || copy.querySelector('[data-a-target="chat-scroller"]')).replaceChildren()
    chat.replaceWith(copy)
  }
  document.getElementById('navigate').onclick = () => {
    history.pushState({}, '', location.pathname === '/fixture_channel' ? '/other_channel' : '/fixture_channel')
    scroller().replaceChildren()
  }
  document.getElementById('split-toggle').onclick = () => {
    document.querySelector('.right-column').classList.toggle('right-column--below')
  }
</script>
<script src="/TwitchLiveChatTweaks.user.js"></script>
</html>
